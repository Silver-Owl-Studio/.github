name: pnpm-artifact-transport-check
'on':
  pull_request:
    paths:
      - .github/workflows/pnpm-artifact-transport-check.yml
permissions: {}
jobs:
  producer:
    name: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      file_path: ${{ steps.bind.outputs.file_path }}
      file_name: ${{ steps.bind.outputs.file_name }}
      length: ${{ steps.bind.outputs.length }}
      sha256: ${{ steps.bind.outputs.sha256 }}
      run_id: ${{ steps.bind.outputs.run_id }}
      run_attempt: ${{ steps.bind.outputs.run_attempt }}
      event_sha: ${{ steps.bind.outputs.event_sha }}
      artifact_id: ${{ steps.bind.outputs.artifact_id }}
      artifact_digest: ${{ steps.bind.outputs.artifact_digest }}
    steps:
      - name: Setup Python (pinned)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
          architecture: x64
          token: ''
          check-latest: false
          allow-prereleases: false
      - name: Generate raw synthetic file
        id: gen
        shell: bash
        env:
          TMPBASE: ${{ runner.temp }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          d="$(mktemp -d "$TMPBASE/sc3p.XXXXXX")"
          chmod 700 "$d"
          python3 -I - "$d" <<'PY'
          import hashlib, json, os, platform, re, sys
          N = 440000
          CAP = 900000
          SCHEMA = 'sc3-artifact-v1'
          if platform.python_version() != '3.12.15' or platform.machine() != 'x86_64':
              sys.exit('runtime mismatch')
          d = sys.argv[1]
          e = os.environ
          run_id = e['RUN_ID']
          attempt = e['RUN_ATTEMPT']
          esha = e['EVENT_SHA']
          if not re.fullmatch('[1-9][0-9]{0,19}', run_id) or not re.fullmatch('[1-9][0-9]{0,2}', attempt) or not re.fullmatch('[0-9a-f]{40}', esha):
              sys.exit('header format')
          if not os.path.isabs(d) or os.path.islink(d) or not os.path.isdir(d) or os.listdir(d):
              sys.exit('directory')
          def stream(label):
              parts = []
              n = 0
              k = 0
              while n < N:
                  parts.append(hashlib.sha256(('sc3|%s|%d' % (label, k)).encode('ascii')).hexdigest())
                  n += 64
                  k += 1
              return ''.join(parts)
          marker = hashlib.sha256('|'.join(['sc3', 'marker', run_id, attempt, esha]).encode('ascii')).hexdigest()
          sp = 'q' + chr(34) + 'b' + chr(92) + 'n' + chr(10) + '$(id) `id`;|&<>' + chr(39)
          a = (sp + marker + stream('a'))[:N]
          b = (marker + stream('b'))[:N]
          doc = json.dumps({'schema': SCHEMA, 'run_id': run_id, 'run_attempt': attempt, 'event_sha': esha, 'a': a, 'b': b}, separators=(',', ':'), ensure_ascii=True)
          data = doc.encode('ascii')
          if len(data) > CAP or data.count(marker.encode('ascii')) != 2:
              sys.exit('generated shape')
          name = 'sc3-artifact-%s-a%s.json' % (run_id, attempt)
          path = os.path.join(d, name)
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'wb') as f:
              f.write(data)
          digest = hashlib.sha256(data).hexdigest()
          out = [('file_path', path), ('file_name', name), ('length', str(len(data))), ('sha256', digest), ('run_id', run_id), ('run_attempt', attempt), ('event_sha', esha)]
          with open(e['GITHUB_OUTPUT'], 'a', encoding='ascii', newline='') as f:
              for k, v in out:
                  f.write(k + '=' + v + chr(10))
          ctrl = len(data) - len(data.translate(None, bytes(list(range(32)) + [127])))
          print('PRODUCED name=%s length=%d sha256=%s' % (name, len(data), digest))
          print('COUNTS ctrl_bytes=%d backslashes=%d ascii=%s marker_count=2' % (ctrl, data.count(bytes([92])), data.isascii()))
          print('RUNTIME py=%s exe=%s os=%s %s' % (platform.python_version(), sys.executable, platform.system(), platform.machine()))
          PY
      - name: Upload raw artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ steps.gen.outputs.file_path }}
          archive: false
          overwrite: false
          include-hidden-files: false
          retention-days: 3
          if-no-files-found: error
      - name: Validate upload result and publish job outputs
        id: bind
        shell: bash
        env:
          FILE_PATH: ${{ steps.gen.outputs.file_path }}
          FILE_NAME: ${{ steps.gen.outputs.file_name }}
          LENGTH: ${{ steps.gen.outputs.length }}
          SHA256: ${{ steps.gen.outputs.sha256 }}
          RUN_ID: ${{ steps.gen.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.gen.outputs.run_attempt }}
          EVENT_SHA: ${{ steps.gen.outputs.event_sha }}
          UP_ID: ${{ steps.upload.outputs.artifact-id }}
          UP_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, os, re, stat, sys
          e = os.environ
          CAP = 900000
          def need(k, pat):
              v = e.get(k, '')
              if not re.fullmatch(pat, v):
                  sys.exit('format ' + k)
              return v
          path = need('FILE_PATH', '/[A-Za-z0-9_./-]{1,200}')
          name = need('FILE_NAME', 'sc3-artifact-[1-9][0-9]{0,19}-a[1-9][0-9]{0,2}[.]json')
          run_id = need('RUN_ID', '[1-9][0-9]{0,19}')
          attempt = need('RUN_ATTEMPT', '[1-9][0-9]{0,2}')
          esha = need('EVENT_SHA', '[0-9a-f]{40}')
          length = need('LENGTH', '[1-9][0-9]{0,5}')
          digest = need('SHA256', '[0-9a-f]{64}')
          aid = need('UP_ID', '[1-9][0-9]{0,14}')
          udig = need('UP_DIGEST', '[0-9a-f]{64}')
          if name != 'sc3-artifact-%s-a%s.json' % (run_id, attempt) or int(length) > CAP:
              sys.exit('binding')
          if udig != digest:
              sys.exit('upload digest differs from local sha256')
          if os.path.basename(path) != name or '..' in path:
              sys.exit('path')
          st = os.lstat(path)
          if not stat.S_ISREG(st.st_mode) or st.st_nlink != 1 or st.st_size != int(length):
              sys.exit('file shape')
          with open(path, 'rb') as f:
              data = f.read(CAP + 1)
          if len(data) != int(length) or hashlib.sha256(data).hexdigest() != digest:
              sys.exit('file changed after generation')
          out = [('file_path', path), ('file_name', name), ('length', length), ('sha256', digest), ('run_id', run_id), ('run_attempt', attempt), ('event_sha', esha), ('artifact_id', aid), ('artifact_digest', udig)]
          with open(e['GITHUB_OUTPUT'], 'a', encoding='ascii', newline='') as f:
              for k, v in out:
                  f.write(k + '=' + v + chr(10))
          print('UPLOAD-BOUND id=%s digest=%s length=%s' % (aid, udig, length))
          PY
      - name: Duplicate upload negative control (expected failure)
        id: dup
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ steps.gen.outputs.file_path }}
          archive: false
          overwrite: false
          include-hidden-files: false
          retention-days: 3
          if-no-files-found: error
      - name: Require duplicate upload rejected
        shell: bash
        env:
          DUP_OUTCOME: ${{ steps.dup.outcome }}
          DUP_ID: ${{ steps.dup.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [ "$DUP_OUTCOME" != failure ] || [ -n "$DUP_ID" ]; then
            echo 'HOLD reason=duplicate_not_rejected'
            exit 1
          fi
          echo 'DUPLICATE-CONTROL-PASS outcome=failure'
  consumer:
    name: consumer
    needs: [producer]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Guard producer result and run-attempt-event binding
        id: guard
        shell: bash
        env:
          PRODUCER_RESULT: ${{ needs.producer.result }}
          P_PATH: ${{ needs.producer.outputs.file_path }}
          P_NAME: ${{ needs.producer.outputs.file_name }}
          P_LEN: ${{ needs.producer.outputs.length }}
          P_SHA: ${{ needs.producer.outputs.sha256 }}
          P_RUN: ${{ needs.producer.outputs.run_id }}
          P_ATT: ${{ needs.producer.outputs.run_attempt }}
          P_ESHA: ${{ needs.producer.outputs.event_sha }}
          P_AID: ${{ needs.producer.outputs.artifact_id }}
          P_DIG: ${{ needs.producer.outputs.artifact_digest }}
          CUR_RUN: ${{ github.run_id }}
          CUR_ATT: ${{ github.run_attempt }}
          CUR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          hold() { echo "HOLD reason=$1"; exit 1; }
          re_ok() { [[ "$1" =~ $2 ]]; }
          valid_id() { re_ok "$1" '^[1-9][0-9]{0,14}$'; }
          for bad in '' 0 01 '1,2' ' 1' '1 ' -1 1e3 9007199254740991 '1 2' '+1' 0x1; do
            if valid_id "$bad"; then hold id_selftest; fi
          done
          valid_id 1 || hold id_selftest
          valid_id 999999999999999 || hold id_selftest
          [ "$PRODUCER_RESULT" = success ] || hold producer_result
          re_ok "$P_RUN" '^[1-9][0-9]{0,19}$' || hold run_id_format
          re_ok "$P_ATT" '^[1-9][0-9]{0,2}$' || hold attempt_format
          re_ok "$P_ESHA" '^[0-9a-f]{40}$' || hold event_sha_format
          re_ok "$P_LEN" '^[1-9][0-9]{0,5}$' || hold length_format
          [ "$P_LEN" -le 900000 ] || hold length_range
          re_ok "$P_SHA" '^[0-9a-f]{64}$' || hold sha256_format
          re_ok "$P_DIG" '^[0-9a-f]{64}$' || hold digest_format
          valid_id "$P_AID" || hold artifact_id_format
          re_ok "$P_PATH" '^/[A-Za-z0-9_./-]{1,200}$' || hold path_format
          [[ "$P_PATH" != *..* ]] || hold path_traversal
          [[ "$P_PATH" == */"$P_NAME" ]] || hold path_name
          [ "$P_NAME" = "sc3-artifact-${P_RUN}-a${P_ATT}.json" ] || hold name_binding
          [ "$P_DIG" = "$P_SHA" ] || hold digest_binding
          [ "$P_RUN" = "$CUR_RUN" ] || hold run_mismatch
          [ "$P_ATT" = "$CUR_ATT" ] || hold attempt_mismatch
          [ "$P_ESHA" = "$CUR_SHA" ] || hold event_sha_mismatch
          {
            echo "artifact_id=$P_AID"
            echo "name=$P_NAME"
            echo "length=$P_LEN"
            echo "sha256=$P_SHA"
            echo "digest=$P_DIG"
            echo "run_id=$P_RUN"
            echo "run_attempt=$P_ATT"
            echo "event_sha=$P_ESHA"
          } >> "$GITHUB_OUTPUT"
          echo 'GUARD-PASS producer succeeded; metadata matches current run, attempt and event sha'
      - name: Setup Python (pinned)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
          architecture: x64
          token: ''
          check-latest: false
          allow-prereleases: false
      - name: Create fresh directories and trusted helper
        id: dirs
        shell: bash
        env:
          TMPBASE: ${{ runner.temp }}
        run: |
          set -euo pipefail
          d="$(mktemp -d "$TMPBASE/sc3c.XXXXXX")"
          chmod 700 "$d"
          mkdir -m 700 "$d/dl" "$d/missing"
          cat > "$d/helper.py" <<'PY'
          import hashlib, json, os, platform, re, stat, sys
          N = 440000
          CAP = 900000
          SCHEMA = 'sc3-artifact-v1'
          RUN_RE = '[1-9][0-9]{0,19}'
          ATT_RE = '[1-9][0-9]{0,2}'
          SHA_RE = '[0-9a-f]{40}'
          HEX_RE = '[0-9a-f]{64}'
          NAME_RE = 'sc3-artifact-[1-9][0-9]{0,19}-a[1-9][0-9]{0,2}[.]json'
          CTRL = bytes(list(range(32)) + [127])
          DATA_CASES = 19
          INV_CASES = 8
          KEYS = ['schema', 'run_id', 'run_attempt', 'event_sha', 'a', 'b']
          class Hold(Exception):
              def __init__(self, reason):
                  super().__init__(reason)
                  self.reason = reason
          def sha(b):
              return hashlib.sha256(b).hexdigest()
          def redump(o):
              return json.dumps(o, separators=(',', ':'), ensure_ascii=True).encode('ascii')
          def ident():
              return 'py=%s exe=%s os=%s %s' % (platform.python_version(), sys.executable, platform.system(), platform.machine())
          def flip_hex(s):
              return ('0' if s[0] != '0' else '1') + s[1:]
          def stream(label):
              parts = []
              n = 0
              k = 0
              while n < N:
                  parts.append(hashlib.sha256(('sc3|%s|%d' % (label, k)).encode('ascii')).hexdigest())
                  n += 64
                  k += 1
              return ''.join(parts)
          def marker_of(run_id, attempt, esha):
              return sha('|'.join(['sc3', 'marker', run_id, attempt, esha]).encode('ascii'))
          def make(run_id, attempt, esha):
              marker = marker_of(run_id, attempt, esha)
              sp = 'q' + chr(34) + 'b' + chr(92) + 'n' + chr(10) + '$(id) `id`;|&<>' + chr(39)
              a = (sp + marker + stream('a'))[:N]
              b = (marker + stream('b'))[:N]
              data = json.dumps({'schema': SCHEMA, 'run_id': run_id, 'run_attempt': attempt, 'event_sha': esha, 'a': a, 'b': b}, separators=(',', ':'), ensure_ascii=True).encode('ascii')
              if len(data) > CAP:
                  raise AssertionError('generator_size')
              return data
          def rebind(d2, c):
              c2 = dict(c)
              c2['length'] = len(d2)
              c2['sha256'] = c2['digest'] = sha(d2)
              return c2
          def verify_bytes(data, c):
              if len(data) > CAP:
                  raise Hold('oversize')
              if len(data) != c['length']:
                  raise Hold('length')
              h = sha(data)
              if h != c['sha256']:
                  raise Hold('sha256')
              if h != c['digest']:
                  raise Hold('digest')
              if not data.isascii():
                  raise Hold('charset')
              if len(data.translate(None, CTRL)) != len(data):
                  raise Hold('control_byte')
              try:
                  o = json.loads(data.decode('ascii'))
              except ValueError:
                  raise Hold('json')
              if not isinstance(o, dict) or list(o) != KEYS:
                  raise Hold('schema')
              if o['schema'] != SCHEMA:
                  raise Hold('schema_value')
              for key, pat, want in (('run_id', RUN_RE, c['run_id']), ('run_attempt', ATT_RE, c['attempt']), ('event_sha', SHA_RE, c['esha'])):
                  v = o[key]
                  if not isinstance(v, str) or not re.fullmatch(pat, v) or v != want:
                      raise Hold(key)
              for key in ('a', 'b'):
                  if not isinstance(o[key], str) or len(o[key]) != N:
                      raise Hold('string_shape')
              if data.count(c['marker'].encode('ascii')) != 2:
                  raise Hold('marker_count')
              if data != c['expected']:
                  raise Hold('content_mismatch')
          def data_controls(data, c):
              mk = c['marker'].encode('ascii')
              ia = data.index(b'"a":"') + 1005
              ib = data.index(b',"b":"') + 2006
              cases = []
              def add(label, reason, d2, c2):
                  cases.append((label, reason, d2, c2))
              def addb(label, reason, d2):
                  add(label, reason, d2, rebind(d2, c))
              def alt(key, val):
                  o = json.loads(data.decode('ascii'))
                  o[key] = val
                  return redump(o)
              c2 = dict(c)
              c2['length'] = c['length'] + 1
              add('length_claim', 'length', data, c2)
              c2 = dict(c)
              c2['sha256'] = flip_hex(c['sha256'])
              add('sha_claim', 'sha256', data, c2)
              c2 = dict(c)
              c2['digest'] = flip_hex(c['digest'])
              add('digest_claim', 'digest', data, c2)
              ba = bytearray(data)
              ba[ia] = 48 if ba[ia] != 48 else 49
              flipped = bytes(ba)
              add('byte_flip', 'sha256', flipped, c)
              addb('substituted_forged_digest', 'content_mismatch', flipped)
              addb('run_id_changed', 'run_id', alt('run_id', str(int(c['run_id']) + 1)))
              addb('attempt_changed', 'run_attempt', alt('run_attempt', str(int(c['attempt']) + 1)))
              addb('event_sha_changed', 'event_sha', alt('event_sha', flip_hex(c['esha'])))
              addb('run_id_noncanonical', 'run_id', alt('run_id', '0' + c['run_id']))
              addb('schema_changed', 'schema_value', alt('schema', 'sc3-artifact-v0'))
              o = json.loads(data.decode('ascii'))
              o['x'] = 'y'
              addb('extra_key', 'schema', redump(o))
              o = json.loads(data.decode('ascii'))
              del o['b']
              addb('missing_key', 'schema', redump(o))
              addb('non_ascii', 'charset', data + bytes([195, 169]))
              addb('control_byte', 'control_byte', data + bytes([10]))
              addb('truncated', 'json', data[:-1])
              add('oversize', 'oversize', b'0' * (CAP + 1), c)
              addb('marker_duplicated', 'marker_count', data[:ib] + mk + data[ib + 64:])
              addb('marker_one_missing', 'marker_count', data.replace(mk, b'0' * 64, 1))
              addb('marker_all_missing', 'marker_count', data.replace(mk, b'0' * 64))
              for label, reason, d2, c3 in cases:
                  try:
                      verify_bytes(d2, c3)
                  except Hold as h:
                      if h.reason != reason:
                          raise AssertionError('wrong_reason ' + label)
                  else:
                      raise AssertionError('accepted ' + label)
              return len(cases)
          def put(p, b):
              fd = os.open(p, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, 'wb') as f:
                  f.write(b)
          def read_expected(d, name):
              if not os.path.isabs(d) or os.path.islink(d) or not os.path.isdir(d):
                  raise Hold('dir')
              if os.listdir(d) != [name]:
                  raise Hold('inventory')
              p = os.path.join(d, name)
              st = os.lstat(p)
              if not stat.S_ISREG(st.st_mode) or st.st_nlink != 1:
                  raise Hold('not_regular')
              if st.st_size > CAP:
                  raise Hold('oversize')
              fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as f:
                  data = f.read(CAP + 1)
              if len(data) > CAP:
                  raise Hold('oversize')
              return data
          def inv_controls(base, name):
              root = os.path.join(base, 'scratch')
              os.mkdir(root, 0o700)
              n = 0
              def case(reason, build):
                  nonlocal n
                  sd = os.path.join(root, 'c%02d' % n)
                  os.mkdir(sd, 0o700)
                  build(sd, os.path.join(root, 'h%02d' % n))
                  try:
                      read_expected(sd, name)
                  except Hold as h:
                      if h.reason != reason:
                          raise AssertionError('wrong_reason inv%d' % n)
                  else:
                      raise AssertionError('accepted inv%d' % n)
                  n += 1
              def empty(sd, h):
                  pass
              def wrong(sd, h):
                  put(os.path.join(sd, 'other.json'), b'x')
              def extra(sd, h):
                  put(os.path.join(sd, name), b'x')
                  put(os.path.join(sd, 'extra.txt'), b'x')
              def subdir(sd, h):
                  put(os.path.join(sd, name), b'x')
                  os.mkdir(os.path.join(sd, 'sub'))
              def symlink(sd, h):
                  os.symlink(os.path.join(root, 'absent'), os.path.join(sd, name))
              def asdir(sd, h):
                  os.mkdir(os.path.join(sd, name))
              def hardlink(sd, h):
                  put(os.path.join(sd, name), b'x')
                  os.link(os.path.join(sd, name), h)
              def big(sd, h):
                  put(os.path.join(sd, name), b'0' * (CAP + 1))
              case('inventory', empty)
              case('inventory', wrong)
              case('inventory', extra)
              case('inventory', subdir)
              case('not_regular', symlink)
              case('not_regular', asdir)
              case('not_regular', hardlink)
              case('oversize', big)
              return n
          def need(k, pat):
              v = os.environ.get(k, '')
              if not re.fullmatch(pat, v):
                  raise Hold('env_' + k.lower())
              return v
          def cmd_verify(d):
              if platform.python_version() != '3.12.15':
                  raise Hold('runtime')
              if not os.path.isabs(d) or not os.path.isdir(d):
                  raise Hold('dir')
              name = need('NAME', NAME_RE)
              run_id = need('RUN_ID', RUN_RE)
              attempt = need('RUN_ATTEMPT', ATT_RE)
              esha = need('EVENT_SHA', SHA_RE)
              length = int(need('LENGTH', '[1-9][0-9]{0,5}'))
              digest = need('SHA256', HEX_RE)
              udig = need('DIGEST', HEX_RE)
              if name != 'sc3-artifact-%s-a%s.json' % (run_id, attempt) or length > CAP or udig != digest:
                  raise Hold('binding')
              c = {'run_id': run_id, 'attempt': attempt, 'esha': esha, 'length': length, 'sha256': digest, 'digest': udig, 'marker': marker_of(run_id, attempt, esha), 'expected': make(run_id, attempt, esha)}
              if len(c['expected']) != length:
                  raise Hold('regen_length')
              data = read_expected(os.environ.get('DL_DIR', ''), name)
              verify_bytes(data, c)
              nd = data_controls(data, c)
              ni = inv_controls(d, name)
              if nd != DATA_CASES or ni != INV_CASES:
                  raise Hold('control_count')
              put(os.path.join(d, 'result.json'), redump({'length': length, 'sha256': digest, 'data_controls': nd, 'inventory_controls': ni}))
              print('VERIFY-PASS name=%s length=%d sha256=%s marker_count=2 regenerated_bytes_equal=True' % (name, length, digest))
              print('NEGATIVE-CONTROLS-PASS data_cases=%d inventory_cases=%d' % (nd, ni))
              print('RUNTIME ' + ident())
          def cmd_final(d):
              p = os.path.join(d, 'result.json')
              if os.path.islink(p) or not os.path.isfile(p):
                  raise Hold('result_file')
              with open(p, encoding='ascii') as f:
                  r = json.load(f)
              want = {'length': int(need('LENGTH', '[1-9][0-9]{0,5}')), 'sha256': need('SHA256', HEX_RE), 'data_controls': DATA_CASES, 'inventory_controls': INV_CASES}
              if any(r.get(k) != v for k, v in want.items()):
                  raise Hold('result_content')
              aid = need('ARTIFACT_ID', '[1-9][0-9]{0,14}')
              print('ARTIFACT-TRANSPORT-CHECK-COMPLETE artifact_id=%s length=%d sha256=%s data_controls=%d inventory_controls=%d' % (aid, want['length'], want['sha256'], DATA_CASES, INV_CASES))
              print('RUNTIME ' + ident())
          def main():
              try:
                  {'verify': cmd_verify, 'final': cmd_final}[sys.argv[1]](sys.argv[2])
              except Hold as h:
                  print('HOLD reason=' + h.reason)
                  sys.exit(1)
              except AssertionError as e:
                  print('CONTROL-FAILURE info=' + str(e)[:60])
                  sys.exit(1)
              except Exception as e:
                  print('ERROR type=' + type(e).__name__)
                  sys.exit(1)
          if __name__ == '__main__':
              main()
          PY
          {
            echo "ttc=$d"
