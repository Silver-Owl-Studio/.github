          } >> "$GITHUB_OUTPUT"
          echo 'DIRS-READY'
      - name: Download raw artifact by exact validated ID
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.guard.outputs.artifact_id }}
          path: ${{ steps.dirs.outputs.dl }}
          skip-decompress: true
          digest-mismatch: error
      - name: Verify downloaded file and run offline negative controls
        shell: bash
        env:
          TTC_DIR: ${{ steps.dirs.outputs.ttc }}
          DL_DIR: ${{ steps.dirs.outputs.dl }}
          NAME: ${{ steps.guard.outputs.name }}
          LENGTH: ${{ steps.guard.outputs.length }}
          SHA256: ${{ steps.guard.outputs.sha256 }}
          DIGEST: ${{ steps.guard.outputs.digest }}
          RUN_ID: ${{ steps.guard.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.guard.outputs.run_attempt }}
          EVENT_SHA: ${{ steps.guard.outputs.event_sha }}
        run: |
          set -euo pipefail
          python3 -I "$TTC_DIR/helper.py" verify "$TTC_DIR"
      - name: Missing-ID platform negative control (expected failure)
        id: missing_id
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 9007199254740991
          path: ${{ steps.dirs.outputs.missing }}
          skip-decompress: true
          digest-mismatch: error
      - name: Require missing-ID control rejected
        shell: bash
        env:
          MISSING_OUTCOME: ${{ steps.missing_id.outcome }}
          MISSING_DIR: ${{ steps.dirs.outputs.missing }}
        run: |
          set -euo pipefail
          if [ "$MISSING_OUTCOME" != failure ]; then
            echo 'HOLD reason=missing_id_not_rejected'
            exit 1
          fi
          if [ -n "$(ls -A -- "$MISSING_DIR")" ]; then
            echo 'HOLD reason=missing_id_dir_not_empty'
            exit 1
          fi
          echo 'MISSING-ID-CONTROL-PASS outcome=failure dir_empty=true'
      - name: Final assertion
        shell: bash
        env:
          TTC_DIR: ${{ steps.dirs.outputs.ttc }}
          LENGTH: ${{ steps.guard.outputs.length }}
          SHA256: ${{ steps.guard.outputs.sha256 }}
          ARTIFACT_ID: ${{ steps.guard.outputs.artifact_id }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          [ "$DOWNLOAD_OUTCOME" = success ] || { echo 'HOLD reason=download_outcome'; exit 1; }
          python3 -I "$TTC_DIR/helper.py" final "$TTC_DIR"
