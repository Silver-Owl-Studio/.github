# Reusable org secret scan (Gitleaks), called from each repository's own
# .github/workflows/secret-scan.yml:
#
#   jobs:
#     gitleaks:
#       uses: Silver-Owl-Studio/.github/.github/workflows/secret-scan.yml@<full commit sha>
#       with:
#         runner: '["self-hosted","Linux","X64","azure-ci"]'
#
# Scope by caller event:
#   pull_request       only the pull request's own commits (merge-base with the live base branch..head),
#                      so old history never blocks a merge; merge-commit diffs are not shown here
#   push               only the pushed commits (before..after), merge commits diffed against their first
#                      parent; full history of the new head, with no exceptions, when "before" is
#                      missing (new branch, or a force-push whose old tip is gone)
#   workflow_dispatch  every ref's full history (manual audit)
#   merge_group and other events are refused (merge queues are not available on this plan).
#
# Rules: Gitleaks default rules only. A repository's .gitleaks.toml is not used and inline
# "gitleaks:allow" comments are ignored. The only exception mechanism is an exact fingerprint in the
# repository's .gitleaksignore, read from the state before the change: the live base branch for a pull
# request, the "before" commit for a push. A change therefore cannot allowlist its own finding; land
# the reviewed fingerprint first. workflow_dispatch audits use the head's copy. Findings are printed fully
# redacted. Accepted limits: secrets inside binaries, archives deeper than 2 levels or encodings deeper
# than 5 are not seen in git mode.
name: Secret scan (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          JSON array of runner labels for private repositories (same-repository events). Use a label
          whose runner group includes the calling repository, or the job queues forever. Public
          repositories and fork pull requests always use ubuntu-latest.
        type: string
        required: false
        default: '["self-hosted","Linux","X64","e16"]'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    # Branch deletions carry no commits to scan.
    if: github.event_name != 'push' || github.event.deleted != true
    # Never check out fork or public-repository content on the persistent self-hosted runners.
    runs-on: >-
      ${{ fromJSON(
        (
          github.event.repository.private == true &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        )
        && inputs.runner
        || '["ubuntu-latest"]'
      ) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Gitleaks 8.30.1 and scan
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077

          is_commit() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$1" =~ ^0{40}$ ]] \
              && git cat-file -e "$1^{commit}" 2>/dev/null
          }

          test "$(git rev-parse --is-shallow-repository)" = false

          scan_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXXXX")
          trap 'rm -rf -- "$scan_dir"' EXIT
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$scan_dir/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$scan_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          test "$("$scan_dir/gitleaks" version)" = "$GITLEAKS_VERSION"

          head="$CURRENT_SHA"
          ignore_from=head
          case "$EVENT_NAME" in
            pull_request)
              head="$PR_HEAD_SHA"
              base=""
              live_base=""
              if [ -n "$PR_BASE_REF" ]; then
                live_base=$(git rev-parse --verify --quiet "refs/remotes/origin/${PR_BASE_REF}^{commit}" || true)
              fi
              if is_commit "$live_base" && is_commit "$head"; then
                base=$(git merge-base "$live_base" "$head" || true)
                ignore_from="$live_base"
              fi
              if ! is_commit "$base"; then
                base="$PR_BASE_SHA"
                ignore_from="$PR_BASE_SHA"
              fi
              merges=off
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              ignore_from="$PUSH_BEFORE_SHA"
              merges=first-parent
              ;;
            workflow_dispatch)
              base=""
              merges=first-parent
              ;;
            *) echo "SECRET_SCAN_UNSUPPORTED_EVENT $EVENT_NAME"; exit 2 ;;
          esac
          if ! is_commit "$head"; then
            echo 'SECRET_SCAN_ERROR head commit missing'
            exit 2
          fi

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            mode=all-history
            log_opts="--all --full-history --diff-merges=${merges}"
          elif is_commit "$base"; then
            mode=range
            log_opts="--diff-merges=${merges} ${base}..${head}"
          else
            # No usable "before" state: scan everything reachable from head without any exceptions.
            mode=head-history
            log_opts="--diff-merges=first-parent ${head}"
            ignore_from=none
          fi

          # Reviewed exceptions: exact fingerprints only, taken from the state before the change.
          # Remove first so a symlink or directory in the checkout is never written through.
          if [ "$ignore_from" != head ]; then
            rm -rf -- .gitleaksignore
            if is_commit "$ignore_from" && git cat-file -e "${ignore_from}:.gitleaksignore" 2>/dev/null; then
              git show "${ignore_from}:.gitleaksignore" > .gitleaksignore
            fi
          fi
          if [ -L .gitleaksignore ] || { [ -e .gitleaksignore ] && [ ! -f .gitleaksignore ]; }; then
            echo 'SECRET_SCAN_CONFIG_REVIEW_REQUIRED .gitleaksignore must be a regular file'
            exit 2
          fi
          ignore_entries=0
          if [ -f .gitleaksignore ]; then
            ignore_entries=$(grep -cvE '^[[:space:]]*(#|$)' .gitleaksignore || true)
          fi

          printf 'title = "Mandatory default secret rules"\n[extend]\nuseDefault = true\n' > "$scan_dir/mandatory.toml"

          echo "Scanning mode=${mode} event=${EVENT_NAME} ignore_from=${ignore_from} ignore_entries=${ignore_entries}"
          result=0
          "$scan_dir/gitleaks" git . \
            --config "$scan_dir/mandatory.toml" \
            --ignore-gitleaks-allow --redact=100 --verbose --no-banner --no-color \
            --max-archive-depth 2 --max-decode-depth 5 --exit-code 10 \
            --log-opts="--no-ext-diff --no-textconv ${log_opts}" || result=$?
          case "$result" in
            0)  echo "SECRET_SCAN_CLEAN mode=${mode}" ;;
            10) echo "SECRET_SCAN_FINDINGS mode=${mode}"
                echo '::error title=Secret scan::Gitleaks found possible secrets (values redacted above). Rotate any real secret first. For a reviewed false positive, land its exact fingerprint in .gitleaksignore in a separate change.'
                exit 10 ;;
            *)  echo "SECRET_SCAN_ERROR mode=${mode} exit=${result}"
                exit 2 ;;
          esac
